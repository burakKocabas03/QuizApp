<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Question')}"></head>
<body>
  <div class="app">
    <header th:replace="~{fragments/layout :: topbar('admin')}"></header>

    <main class="main">
      <div class="container" style="max-width:760px">

        <div class="section-head">
          <div>
            <h1 class="mb-0" th:text="${question.id != null ? 'Edit question' : 'New question'}">Question</h1>
            <p class="muted mb-0">Fill in the question text, four options, and pick the correct one.</p>
          </div>
          <a th:href="@{/admin}" class="btn btn-ghost btn-sm">← Back</a>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="${question.id != null} ? @{'/admin/questions/' + ${question.id}} : @{/admin/questions}"
              method="post" th:object="${question}" class="panel">
          <div class="panel-body stack">

            <div class="form-group">
              <label for="prompt" class="form-label">Question text</label>
              <textarea id="prompt" name="prompt" th:field="*{prompt}" class="form-control" required
                        placeholder="e.g. What is the time complexity of binary search?"></textarea>
            </div>

            <div class="row">
              <div class="col form-group">
                <label for="categoryId" class="form-label">Category</label>
                <select id="categoryId" name="categoryId" class="form-control" required>
                  <option value="" disabled>Select category</option>
                  <option th:each="c : ${categories}"
                          th:value="${c.id}"
                          th:selected="${question.category != null and question.category.id == c.id}"
                          th:text="${c.name}">Category</option>
                </select>
              </div>
              <div class="col form-group">
                <label for="correctOption" class="form-label">Correct option</label>
                <select id="correctOption" name="correctOption" th:field="*{correctOption}" class="form-control" required>
                  <option value="A">A — Option 1</option>
                  <option value="B">B — Option 2</option>
                  <option value="C">C — Option 3</option>
                  <option value="D">D — Option 4</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Options</label>
              <div class="stack">
                <div class="flex items-center gap-1">
                  <span class="option-letter">A</span>
                  <input name="optionA" th:value="${question.optionA}" class="form-control" required placeholder="Option A" />
                </div>
                <div class="flex items-center gap-1">
                  <span class="option-letter">B</span>
                  <input name="optionB" th:value="${question.optionB}" class="form-control" required placeholder="Option B" />
                </div>
                <div class="flex items-center gap-1">
                  <span class="option-letter">C</span>
                  <input name="optionC" th:value="${question.optionC}" class="form-control" required placeholder="Option C" />
                </div>
                <div class="flex items-center gap-1">
                  <span class="option-letter">D</span>
                  <input name="optionD" th:value="${question.optionD}" class="form-control" required placeholder="Option D" />
                </div>
              </div>
            </div>

            <div class="flex justify-between items-center gap-2" style="flex-wrap:wrap">
              <a th:href="@{/admin}" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn">Save question</button>
            </div>
          </div>
        </form>

      </div>
    </main>
  </div>
</body>
</html>
