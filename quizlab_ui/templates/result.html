<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quiz result')}"></head>
<body>
  <div class="app">
    <header th:replace="~{fragments/layout :: topbar('user')}"></header>

    <main class="main">
      <div class="container">

        <!-- Hero score -->
        <section class="panel mb-3">
          <div class="panel-body">
            <div class="score-hero">
              <div class="score-ring"
                   th:with="pct=${result.total > 0 ? (result.score * 100 / result.total) : 0},
                            circ=502,
                            offset=${502 - (502 * (result.total > 0 ? (result.score * 100 / result.total) : 0) / 100)}">
                <svg viewBox="0 0 180 180">
                  <circle cx="90" cy="90" r="80" class="score-ring-bg"></circle>
                  <circle cx="90" cy="90" r="80" class="score-ring-fg"
                          th:attr="stroke-dasharray=${circ}, stroke-dashoffset=${offset}"></circle>
                </svg>
                <div class="score-value">
                  <div>
                    <div class="num" th:text="${result.score} + '/' + ${result.total}">8/10</div>
                    <div class="lbl" th:text="${#numbers.formatDecimal(result.total > 0 ? result.score * 100.0 / result.total : 0, 1, 0)} + '% score'">80% score</div>
                  </div>
                </div>
              </div>

              <h1 th:text="${result.quizTitle}">Quiz title</h1>
              <p class="muted" th:text="${result.category} + ' · Completed ' + ${#temporals.format(result.takenAt, 'dd MMM yyyy, HH:mm')}">Category · Completed today</p>

              <div class="score-meta">
                <div class="score-meta-item">
                  <div class="v" style="color: var(--success)" th:text="${result.correctCount}">8</div>
                  <div class="k">Correct</div>
                </div>
                <div class="score-meta-item">
                  <div class="v" style="color: var(--danger)" th:text="${result.wrongCount}">2</div>
                  <div class="k">Incorrect</div>
                </div>
                <div class="score-meta-item">
                  <div class="v" th:text="${result.timeTaken}">07:42</div>
                  <div class="k">Time taken</div>
                </div>
              </div>

              <div class="mt-3">
                <a th:href="@{/dashboard}" class="btn btn-secondary">Back to dashboard</a>
              </div>
            </div>
          </div>
        </section>

        <!-- Review -->
        <section class="panel">
          <div class="panel-header"><h2 class="panel-title">Answer review</h2></div>
          <div class="panel-body">
            <div class="review-list">
              <div class="review-item"
                   th:each="r, iter : ${result.reviews}"
                   th:classappend="${r.correct} ? ' correct' : ' wrong'">
                <div class="review-q">
                  <span class="muted text-sm">Q<span th:text="${iter.count}">1</span>.</span>
                  <span th:text="${r.questionText}">Question text</span>
                </div>
                <div class="review-a">
                  <div>
                    <span class="lbl">Your answer:</span>
                    <span th:class="${r.correct ? 'your right' : 'your wrong'}"
                          th:text="${r.selectedAnswer != null ? r.selectedAnswer : 'Not answered'}">Option</span>
                  </div>
                  <div th:unless="${r.correct}">
                    <span class="lbl">Correct answer:</span>
                    <span class="correct-ans" th:text="${r.correctAnswer}">Correct option</span>
                  </div>
                </div>
              </div>
            </div>

            <div th:if="${result.reviews == null or #lists.isEmpty(result.reviews)}" class="empty">
              <div class="empty-text">No answer details available.</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
